<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="400" fill="#f5f5f5" />
  
  <!-- 手提包1 - 左侧 -->
  <g transform="translate(150, 100)">
    <!-- 包身 -->
    <path d="M0 50 L120 50 L130 70 L130 180 L10 180 L10 70 Z" fill="#e74c3c" />
    <!-- 包盖 -->
    <path d="M0 50 L120 50 L130 70 L10 70 Z" fill="#c0392b" />
    <!-- 手柄 -->
    <path d="M30 20 Q60 0 90 20" fill="none" stroke="#c0392b" stroke-width="4" />
    <path d="M30 20 L30 50" fill="none" stroke="#c0392b" stroke-width="4" />
    <path d="M90 20 L90 50" fill="none" stroke="#c0392b" stroke-width="4" />
    <!-- 装饰 -->
    <circle cx="60" cy="100" r="8" fill="#fff" />
  </g>
  
  <!-- 手提包2 - 中间 -->
  <g transform="translate(350, 80)">
    <!-- 包身 -->
    <path d="M0 40 L150 40 L160 60 L160 200 L0 200 Z" fill="#3498db" />
    <!-- 包盖 -->
    <path d="M0 40 L150 40 L160 60 L0 60 Z" fill="#2980b9" />
    <!-- 手柄 -->
    <path d="M40 10 Q75 -10 110 10" fill="none" stroke="#2980b9" stroke-width="5" />
    <path d="M40 10 L40 40" fill="none" stroke="#2980b9" stroke-width="5" />
    <path d="M110 10 L110 40" fill="none" stroke="#2980b9" stroke-width="5" />
    <!-- 装饰 -->
    <rect x="50" y="100" width="50" height="80" rx="5" fill="#2980b9" opacity="0.3" />
  </g>
  
  <!-- 手提包3 - 右侧 -->
  <g transform="translate(550, 120)">
    <!-- 包身 -->
    <path d="M10 30 L100 30 L110 50 L110 150 L0 150 L0 50 Z" fill="#9b59b6" />
    <!-- 包盖 -->
    <path d="M10 30 L100 30 L110 50 L0 50 Z" fill="#8e44ad" />
    <!-- 手柄 -->
    <path d="M30 10 Q55 0 80 10" fill="none" stroke="#8e44ad" stroke-width="3" />
    <path d="M30 10 L30 30" fill="none" stroke="#8e44ad" stroke-width="3" />
    <path d="M80 10 L80 30" fill="none" stroke="#8e44ad" stroke-width="3" />
    <!-- 装饰 -->
    <path d="M20 100 L90 100" fill="none" stroke="#8e44ad" stroke-width="3" />
    <path d="M20 120 L90 120" fill="none" stroke="#8e44ad" stroke-width="3" />
  </g>
  
  <!-- 装饰元素 -->
  <circle cx="100" cy="300" r="10" fill="#e74c3c" opacity="0.5" />
  <circle cx="200" cy="280" r="8" fill="#3498db" opacity="0.5" />
  <circle cx="300" cy="320" r="12" fill="#9b59b6" opacity="0.5" />
  <circle cx="500" cy="300" r="10" fill="#e74c3c" opacity="0.5" />
  <circle cx="600" cy="280" r="8" fill="#3498db" opacity="0.5" />
  <circle cx="700" cy="320" r="12" fill="#9b59b6" opacity="0.5" />
</svg>